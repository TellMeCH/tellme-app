[project]
name = "tellme"
version = "0.1.0"
description = ""
authors = [{name = "altogi", email = "alvaro.tomasgil@tell-me.ch"}]
requires-python = ">=3.12,<3.13"

dependencies = [
    "django>=5.2.6",
    "djangorestframework>=3.17.1",
    "psycopg2-binary>=2.9.10",
    "firebase-admin>=7.1.0",
    "sentry-sdk[django]>=2.38.0",
    "openai>=1.108.0",
    "drf-spectacular>=0.28.0",
    "langfuse>=3.11.0",
    "tiktoken>=0.12.0",
    "django-environ>=0.12.0",
    "django-storages>=1.14.6",
    "google-cloud-secret-manager>=2.24.0",
    "google-cloud-tasks>=2.19.3",
    "deepgram-sdk>=5.3.0",
    "pydub>=0.25.1",
    "gunicorn>=23.0.0",
    "tenacity>=9.1.2",
    "google-cloud-dlp>=3.32.0",
    "channels>=4.3.1",
    "daphne>=4.2.1",
    "django-cors-headers>=4.9.0",
    "groq>=0.31.1",
    "google-genai>=1.38.0",
    "mailersend<2.0.0",
    "python-dateutil>=2.9.0.post0",
    "dateparser>=1.2.2",
    "nameparser>=1.1.3",
    "beautifulsoup4>=4.14.0",
    "google-api-python-client>=2.183.0",
    "posthog>=3.7.4",
    "litellm>=1.0.0",
    "django-health-check>=3.20.0",
    "django-two-factor-auth>=1.18.1",
    "qrcode>=8.2",
    "freezegun>=1.5.5",
    "cryptography>=44.0.0",
    "jira>=3.8.0",
]

[dependency-groups]
dev = [
    "google-cloud-logging>=3.12.1",
    "pytest-asyncio>=1.2.0",
    "pytest-django>=4.11.1",
    "pytest-mock>=3.15.1",
    "pytz>=2025.2",
]

[tool.hatch.build.targets.wheel]
packages = ["tell_me"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
