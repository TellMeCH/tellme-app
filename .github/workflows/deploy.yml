name: Deployment

on:
  pull_request:
    branches:
      - main
      - staging
    types: [closed]

env:
  TELLME_ENV: ${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}

jobs:
  deploy:
    environment:
      name: ${{ github.ref_name }}
    name: Deploy to GCP

    runs-on: ubuntu-latest
    env:
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
      REGION: ${{ secrets.GCP_PROJECT_REGION }}
      DEBUG: 0
      SETTINGS_NAME: ${{ vars.SETTINGS_NAME }}
      SQL_INSTANCE_NAME: ${{ vars.SQL_INSTANCE_NAME }}
      DATABASE_NAME: ${{ vars.DATABASE_NAME }}
      GS_BUCKET_NAME: ${{ secrets.GCP_PROJECT_ID }}_${{ vars.MEDIA_BUCKET }}
      ARTIFACT_REPO: ${{ vars.ARTIFACT_REPO }}
      SERVICE_NAME: ${{ vars.SERVICE_NAME }}
      CLOUD_TASKS_QUEUE_NAME: ${{ vars.CLOUD_TASKS_QUEUE_NAME }}
      CALL_PROCESSING_BUCKET: ${{ vars.CALL_PROCESSING_BUCKET }}
      FRONTEND_PATH: ${{ secrets.FRONTEND_PATH }}
      CALL_PROCESSING_ENDPOINT: none
      USE_CLOUD_SQL_AUTH_PROXY: 1
      COLLECT_STATIC: false
      CREATE_SUPERUSERS: true
    if: github.event.pull_request.merged == true

    permissions:
      contents: 'read'
      id-token: 'write'
      pull-requests: 'read'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.CICD_SERVICE_ACCOUNT }}
          export_default_credentials: true

      - name: Detect New Migrations
        id: detect_changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            migrations:
              - 'call_miner/migrations/**'

      - name: Print TELLME_ENV
        run: |
          echo "TELLME_ENV=$TELLME_ENV"

      - name: Start Cloud SQL Proxy
        if: steps.detect_changes.outputs.migrations == 'true' || env.COLLECT_STATIC == 'true' || env.CREATE_SUPERUSERS == 'true'
        run: |
          curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          nohup ./cloud-sql-proxy \
            --port=5433 \
            ${{ secrets.GCP_PROJECT_ID }}:${{ secrets.GCP_PROJECT_REGION }}:${{ vars.SQL_INSTANCE_NAME }} \
            > cloud_sql_proxy.log 2>&1 &
          sleep 10

      - name: Set up Python
        if: steps.detect_changes.outputs.migrations == 'true' || env.COLLECT_STATIC == 'true' || env.CREATE_SUPERUSERS == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Poetry
        if: steps.detect_changes.outputs.migrations == 'true' || env.COLLECT_STATIC == 'true' || env.CREATE_SUPERUSERS == 'true'
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo 'export PATH="$HOME/.local/bin:$PATH"' >> $GITHUB_ENV

      - name: Install Dependencies
        if: steps.detect_changes.outputs.migrations == 'true' || env.COLLECT_STATIC == 'true' || env.CREATE_SUPERUSERS == 'true'
        run: |
          poetry install --with dev --sync

      - name: Check Cloud SQL Proxy Is Running
        if: steps.detect_changes.outputs.migrations == 'true' || env.COLLECT_STATIC == 'true' || env.CREATE_SUPERUSERS == 'true'
        run: |
          cat cloud_sql_proxy.log
          if ! pgrep -f cloud-sql-proxy; then
            echo "Cloud SQL Proxy is not running."
            exit 1
          fi

      - name: Run Migrations
        if: steps.detect_changes.outputs.migrations == 'true'
        run: |
          poetry run python manage.py migrate

      - name: Collect Static
        if: env.COLLECT_STATIC == 'true'
        run: |
          poetry run python manage.py collectstatic --noinput

      - name: Create Superuser Accounts
        if: env.CREATE_SUPERUSERS == 'true'
        env:
          PASSWORDS_NAME: ${{ vars.PASSWORDS_NAME }}
        run: |
          poetry run python manage.py create_superusers

      - name: Login to Google Artifact Registry
        uses: docker/login-action@v3
        with:
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
          registry: ${{ secrets.GCP_PROJECT_REGION }}-docker.pkg.dev

      - name: Build, tag and push container
        id: build-image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.GCP_PROJECT_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPO }}/${{ vars.SERVICE_NAME }}:${{ github.sha }}

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ vars.SERVICE_NAME }}
          timeout: 30m
          flags: |
            --allow-unauthenticated
            --min-instances=0
            --max-instances=10
            --execution-environment=gen2
            --service-account=${{ vars.SERVICE_NAME }}-account@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com
            --add-cloudsql-instances=${{ secrets.GCP_PROJECT_ID }}:${{ secrets.GCP_PROJECT_REGION }}:${{ vars.SQL_INSTANCE_NAME }}
          region: ${{ secrets.GCP_PROJECT_REGION }}
          image: ${{ secrets.GCP_PROJECT_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPO }}/${{ vars.SERVICE_NAME }}:${{ github.sha }}
          env_vars: |
            GOOGLE_CLOUD_PROJECT=${{ secrets.GCP_PROJECT_ID }}
            REGION=${{ secrets.GCP_PROJECT_REGION }}
            TELLME_ENV=${{ env.TELLME_ENV }}
            DEBUG=0
            SETTINGS_NAME=${{ vars.SETTINGS_NAME }}
            SQL_INSTANCE_NAME=${{ vars.SQL_INSTANCE_NAME }}
            DATABASE_NAME=${{ vars.DATABASE_NAME }}
            GS_BUCKET_NAME=${{ secrets.GCP_PROJECT_ID }}_${{ vars.MEDIA_BUCKET }}
            CLOUD_TASKS_QUEUE_NAME=${{ vars.CLOUD_TASKS_QUEUE_NAME }}
            CALL_PROCESSING_BUCKET=${{ vars.CALL_PROCESSING_BUCKET }}
            FRONTEND_PATH=${{ secrets.FRONTEND_PATH }}
            CALL_PROCESSING_ENDPOINT=None

      - name: Determine Cloud Run URL
        id: extract_urls
        run: |
          PROJECT_NUMBER=$(gcloud projects describe $GOOGLE_CLOUD_PROJECT --format='value(projectNumber)')
          CLOUD_RUN_URLS="https://${{ vars.SERVICE_NAME }}-${PROJECT_NUMBER}.${{ secrets.GCP_PROJECT_REGION }}.run.app"
          CLOUD_RUN_URLS="${CLOUD_RUN_URLS},${{ steps.deploy.outputs.url }}"
          echo "urls=$CLOUD_RUN_URLS" >> $GITHUB_OUTPUT
          echo "base_url=https://${{ vars.SERVICE_NAME }}-${PROJECT_NUMBER}.${{ secrets.GCP_PROJECT_REGION }}.run.app" >> $GITHUB_OUTPUT

      - name: Update the Application to use those Service URLs
        run: |
          gcloud run services update ${{ vars.SERVICE_NAME }} \
            --region ${{ secrets.GCP_PROJECT_REGION }} \
            --update-env-vars "^##^CLOUDRUN_SERVICE_URLS=${{ steps.extract_urls.outputs.urls }}"

      - name: Update the Application to use the correct Call Processing Endpoint
        run: |
          gcloud run services update ${{ vars.SERVICE_NAME }} \
            --region ${{ secrets.GCP_PROJECT_REGION }} \
            --update-env-vars CALL_PROCESSING_ENDPOINT="${{ steps.extract_urls.outputs.base_url }}${{ vars.CALL_PROCESSING_ADDRESS }}"

      - name: Deploy Monitoring Cloud Function
        id: deploy_monitoring
        if: env.TELLME_ENV == 'staging'
        uses: google-github-actions/deploy-cloud-functions@v3
        with:
          name: ${{ vars.MONITORING_FUNCTION }}
          runtime: python312
          region: ${{ secrets.GCP_PROJECT_REGION }}
          source_dir: ./monitoring_functions/langfuse_exporter
          entry_point: export_from_langfuse
          memory: 1024M
          service_timeout: 300s
          service_account: "${{ vars.MONITORING_FUNCTION }}-account@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com"
          build_service_account: "projects/${{ secrets.GCP_PROJECT_ID }}/serviceAccounts/${{ secrets.CICD_SERVICE_ACCOUNT }}"
          environment_variables: |-
            SETTINGS_NAME=${{ vars.SETTINGS_NAME }}
            GOOGLE_CLOUD_PROJECT=${{ secrets.GCP_PROJECT_ID }}
            MONITORING_BUCKET=${{ vars.MONITORING_BUCKET }}

      - name: Give Run Invoker access to the Cloud Function Service Account
        if: env.TELLME_ENV == 'staging'
        run: |
          gcloud functions add-iam-policy-binding ${{ vars.MONITORING_FUNCTION }} \
            --region ${{ secrets.GCP_PROJECT_REGION }} \
            --member "serviceAccount:${{ vars.MONITORING_FUNCTION }}-account@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --role "roles/cloudfunctions.invoker"

      - name: Configure a Cloud Scheduler to hit this function daily
        if: env.TELLME_ENV == 'staging'
        run: |
          EXISTING_JOB=$(gcloud scheduler jobs describe ${{ vars.MONITORING_FUNCTION }} --location="${{ secrets.GCP_PROJECT_REGION }}" --format="value(name)" 2>/dev/null || true)
          echo "EXISTING_JOB=$EXISTING_JOB"
          if [ -n "$EXISTING_JOB" ]; then
            gcloud scheduler jobs update http ${{ vars.MONITORING_FUNCTION }} \
              --location="${{ secrets.GCP_PROJECT_REGION }}" \
              --schedule="0 0 * * *" \
              --time-zone="Etc/UTC" \
              --uri="${{ steps.deploy_monitoring.outputs.url }}" \
              --http-method=GET \
              --oidc-service-account-email="${{ vars.MONITORING_FUNCTION }}-account@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
              --oidc-token-audience="${{ steps.deploy_monitoring.outputs.url }}"
          else
            gcloud scheduler jobs create http ${{ vars.MONITORING_FUNCTION }} \
              --location="${{ secrets.GCP_PROJECT_REGION }}" \
              --schedule="0 0 * * *" \
              --time-zone="Etc/UTC" \
              --uri="${{ steps.deploy_monitoring.outputs.url }}" \
              --http-method=GET \
              --oidc-service-account-email="${{ vars.MONITORING_FUNCTION }}-account@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
              --oidc-token-audience="${{ steps.deploy_monitoring.outputs.url }}"
          fi

  smoke_test:
    environment:
      name: ${{ github.ref_name }}
    name: Test Deployed Application

    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: 'read'
      id-token: 'write'
      pull-requests: 'read'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          credentials_json: ${{ secrets.CICD_SERVICE_ACCOUNT_JSON_KEY }}
          service_account: ${{ secrets.CICD_SERVICE_ACCOUNT }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo 'export PATH="$HOME/.local/bin:$PATH"' >> $GITHUB_ENV

      - name: Install Dependencies
        run: |
          poetry install --with dev --sync

      - name: Determine Cloud Run URL
        id: extract_urls
        run: |
          PROJECT_NUMBER=$(gcloud projects describe $GOOGLE_CLOUD_PROJECT --format='value(projectNumber)')
          CLOUD_RUN_URL="https://${{ vars.SERVICE_NAME }}-${PROJECT_NUMBER}.${{ secrets.GCP_PROJECT_REGION }}.run.app"
          echo "url=$CLOUD_RUN_URL" >> $GITHUB_OUTPUT

      - name: Build Audiohook emulator image
        run: |
          docker build -t genesys_audiohook_emulator:latest \
            -f ./genesys_audiohook_emulator/Dockerfile \
            ./genesys_audiohook_emulator


      - name: Run Remote Smoke Tests
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_PROJECT_REGION }}
          TELLME_ENV: ${{ env.TELLME_ENV }}
          SERVICE_NAME: ${{ vars.SERVICE_NAME }}
          SQL_INSTANCE_NAME: ${{ vars.SQL_INSTANCE_NAME }}
          DATABASE_NAME: ${{ vars.DATABASE_NAME }}
          GS_BUCKET_NAME: ${{ secrets.GCP_PROJECT_ID }}_${{ vars.MEDIA_BUCKET }}
          SETTINGS_NAME: ${{ vars.SETTINGS_NAME }}
          PASSWORDS_NAME: ${{ vars.PASSWORDS_NAME }}
          CLOUD_TASKS_QUEUE_NAME: ${{ vars.CLOUD_TASKS_QUEUE_NAME }}
          CALL_PROCESSING_BUCKET: ${{ vars.CALL_PROCESSING_BUCKET }}
          CALL_PROCESSING_ENDPOINT: ${{ steps.extract_urls.outputs.url }}${{ vars.CALL_PROCESSING_ADDRESS }}
          FRONTEND_PATH: ${{ secrets.FRONTEND_PATH }}
          DEBUG: 0
          USE_CLOUD_SQL_AUTH_PROXY: 1
          CLOUD_RUN_HOST: ${{ steps.extract_urls.outputs.url }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
        run: |
          poetry run pytest -v ./call_processing/tests/test_smoke_remote.py
