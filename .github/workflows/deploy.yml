name: Deployment

on:
  pull_request:
    branches:
      - main
      - staging
    types: [closed]

jobs:
  build-and-deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Environment Variable Based on Branch
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "TELLME_ENV=prod" >> $GITHUB_ENV
          elif [ "${{ github.ref }}" == "refs/heads/staging" ]; then
            echo "TELLME_ENV=dev" >> $GITHUB_ENV
          fi

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2.1.3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.CICD_SERVICE_ACCOUNT }}

      - name: Install Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build Docker Image
        run: |
          docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/your-app-name:$GITHUB_SHA .

      - name: Push Docker Image
        run: |
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/your-app-name:$GITHUB_SHA

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy your-app-name \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/your-app-name:$GITHUB_SHA \
            --region ${{ secrets.GCP_PROJECT_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars SECRET_KEY=${{ secrets.SECRET_KEY }},DEBUG=0