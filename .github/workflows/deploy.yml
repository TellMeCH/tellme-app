name: Deployment

on:
  pull_request:
    branches:
      - main
      - staging
    types: [closed]

env:
  TELLME_ENV: ${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}

jobs:
  deploy:
    environment:
      name: ${{ github.ref_name }}
    name: Deploy to GCP

    runs-on: ubuntu-latest
    outputs:
      cloud_run_url: ${{ steps.terraform_apply.outputs.cloud_run_url }}
      load_balancer_url: ${{ steps.terraform_apply.outputs.load_balancer_url }}
    env:
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
      REGION: ${{ secrets.GCP_PROJECT_REGION }}
      USE_CLOUD_SQL_AUTH_PROXY: 1
      RUN_MIGRATIONS: true
      COLLECT_STATIC: false
      CREATE_SUPERUSERS: false
    if: github.event.pull_request.merged == true

    permissions:
      contents: 'read'
      id-token: 'write'
      pull-requests: 'read'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.CICD_SERVICE_ACCOUNT }}
          export_default_credentials: true

      - name: Detect New Migrations
        id: detect_changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            migrations:
              - 'tellme/call_miner/migrations/**'

      - name: Start Cloud SQL Proxy
        run: |
          curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          nohup ./cloud-sql-proxy \
            --port=5433 \
            ${{ secrets.GCP_PROJECT_ID }}:${{ secrets.GCP_PROJECT_REGION }}:${{ vars.SQL_INSTANCE_NAME }} \
            > cloud_sql_proxy.log 2>&1 &
          sleep 10

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Dependencies
        run: |
          uv sync --dev

      - name: Check Cloud SQL Proxy Is Running
        run: |
          cat cloud_sql_proxy.log
          if ! pgrep -f cloud-sql-proxy; then
            echo "Cloud SQL Proxy is not running."
            exit 1
          fi

      - name: Login to Google Artifact Registry
        uses: docker/login-action@v3
        with:
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
          registry: ${{ secrets.GCP_PROJECT_REGION }}-docker.pkg.dev

      - name: Build, tag and push container
        id: build-image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.GCP_PROJECT_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPO }}/${{ vars.SERVICE_NAME }}:${{ github.sha }}

      - name: Compose image ref (repo@digest)
        id: imgref
        run: |
          echo "image_ref=${{ secrets.GCP_PROJECT_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPO }}/${{ vars.SERVICE_NAME }}@${{ steps.build-image.outputs.digest }}" >> "$GITHUB_OUTPUT"

      - name: Terraform Init
        working-directory: terraform/environments/${{ env.TELLME_ENV }}
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: terraform/environments/${{ env.TELLME_ENV }}
        run: terraform validate -no-color

      - name: Get Database and Django Credentials from Secret Manager
        id: db_secrets
        uses: google-github-actions/get-secretmanager-secrets@v3
        with:
          secrets: |-
            database_admin:${{ secrets.GCP_PROJECT_ID }}/database_admin
            django_settings:${{ secrets.GCP_PROJECT_ID }}/${{ vars.SETTINGS_NAME }}

      - name: Parse Database Admin Credentials
        id: db_admin_creds
        run: |
          DB_ADMIN_USERNAME=$(echo "${{ steps.db_secrets.outputs.database_admin }}" | grep "^DB_ADMIN_USERNAME=" | cut -d'=' -f2 | sed "s/^'//;s/'$//")
          DB_ADMIN_PASSWORD=$(echo "${{ steps.db_secrets.outputs.database_admin }}" | grep "^DB_ADMIN_PASSWORD=" | cut -d'=' -f2 | sed "s/^'//;s/'$//")
          echo "admin_username=$DB_ADMIN_USERNAME" >> $GITHUB_OUTPUT
          echo "admin_password=$DB_ADMIN_PASSWORD" >> $GITHUB_OUTPUT

      - name: Parse Django Database Credentials
        id: django_db_creds
        run: |
          DATABASE_USERNAME=$(echo "${{ steps.db_secrets.outputs.django_settings }}" | grep "^DATABASE_USERNAME=" | cut -d'=' -f2)
          DATABASE_PASSWORD=$(echo "${{ steps.db_secrets.outputs.django_settings }}" | grep "^DATABASE_PASSWORD=" | cut -d'=' -f2)
          echo "app_username=$DATABASE_USERNAME" >> $GITHUB_OUTPUT
          echo "app_password=$DATABASE_PASSWORD" >> $GITHUB_OUTPUT

      - name: Terraform Plan
        working-directory: terraform/environments/${{ env.TELLME_ENV }}
        env:
          TF_VAR_cf_origin_cert: ${{ secrets.CF_ORIGIN_CERT }}
          TF_VAR_cf_origin_key: ${{ secrets.CF_ORIGIN_KEY }}
        run: |
          # Base terraform plan command
          PLAN_ARGS=(
            -no-color
            -input=false
            -out=tfplan.bin
            -var "project_id=${{ secrets.GCP_PROJECT_ID }}"
            -var "region=${{ secrets.GCP_PROJECT_REGION }}"
            -var "service_name=${{ vars.SERVICE_NAME }}"
            -var "sql_instance=${{ vars.SQL_INSTANCE_NAME }}"
            -var "github_repo=${GITHUB_REPOSITORY}"
            -var "media_bucket=${{ vars.MEDIA_BUCKET }}"
            -var "call_processing_bucket=${{ vars.CALL_PROCESSING_BUCKET }}"
            -var "image_url=${{ steps.imgref.outputs.image_ref }}"
            -var "settings_name=${{ vars.SETTINGS_NAME }}"
            -var "database_name=${{ vars.DATABASE_NAME }}"
            -var "processing_queue_name=${{ vars.PROCESSING_QUEUE_NAME }}"
            -var "summarization_queue_name=${{ vars.SUMMARIZATION_QUEUE_NAME }}"
            -var "tickets_queue_name=${{ vars.TICKETS_QUEUE_NAME }}"
            -var "frontend_path=${{ secrets.FRONTEND_PATH }}"
            -var "admin_username=${{ steps.db_admin_creds.outputs.admin_username }}"
            -var "admin_password=${{ steps.db_admin_creds.outputs.admin_password }}"
            -var "app_username=${{ steps.django_db_creds.outputs.app_username }}"
            -var "app_password=${{ steps.django_db_creds.outputs.app_password }}"
            -var "iap_client_id=${{ secrets.IAP_CLIENT_ID }}"
            -var "iap_client_secret=${{ secrets.IAP_CLIENT_SECRET }}"
            -var 'iap_allowed_members=${{ secrets.IAP_ALLOWED_MEMBERS }}'
          )

          # Add alert email addresses for production only
          if [ "${{ env.TELLME_ENV }}" = "prod" ]; then
            PLAN_ARGS+=(-var 'alert_email_addresses=${{ secrets.DB_ALERT_EMAILS }}')
          fi

          terraform plan "${PLAN_ARGS[@]}"

      - name: Terraform Apply
        working-directory: terraform/environments/${{ env.TELLME_ENV }}
        env:
          TF_VAR_cf_origin_cert: ${{ secrets.CF_ORIGIN_CERT }}
          TF_VAR_cf_origin_key: ${{ secrets.CF_ORIGIN_KEY }}
        run: |
          terraform apply -auto-approve tfplan.bin

      - name: Extract Deployment URLs
        id: terraform_apply
        working-directory: terraform/environments/${{ env.TELLME_ENV }}
        run: |
          CLOUD_RUN_URL=$(terraform output -raw cloud_run_service_uri)
          LOAD_BALANCER_URL=$(terraform output -raw load_balancer_url)
          echo "cloud_run_url=$CLOUD_RUN_URL" >> $GITHUB_OUTPUT
          echo "load_balancer_url=$LOAD_BALANCER_URL" >> $GITHUB_OUTPUT
          echo "Load Balancer URL: $LOAD_BALANCER_URL"

      - name: Run Migrations
        if: steps.detect_changes.outputs.migrations == 'true' || env.RUN_MIGRATIONS == 'true'
        env:
          DEBUG: 0
          SETTINGS_NAME: ${{ vars.SETTINGS_NAME }}
          SQL_INSTANCE_NAME: ${{ vars.SQL_INSTANCE_NAME }}
          DATABASE_NAME: ${{ vars.DATABASE_NAME }}
          GS_BUCKET_NAME: ${{ secrets.GCP_PROJECT_ID }}_${{ vars.MEDIA_BUCKET }}
          PROCESSING_QUEUE_NAME: ${{ vars.PROCESSING_QUEUE_NAME }}
          SUMMARIZATION_QUEUE_NAME: ${{ vars.SUMMARIZATION_QUEUE_NAME }}
          TICKETS_QUEUE_NAME: ${{ vars.TICKETS_QUEUE_NAME }}
          CALL_PROCESSING_BUCKET: ${{ vars.CALL_PROCESSING_BUCKET }}
          FRONTEND_PATH: ${{ secrets.FRONTEND_PATH }}
          CALL_PROCESSING_ENDPOINT: "None"
          SUMMARIZATION_ENDPOINT: "None"
          TICKETS_ENDPOINT: "None"
          SERVICE_ACCOUNT_EMAIL: "None"
        run: |
          uv run python manage.py migrate

      - name: Purge Expired Ephemeral Tokens
        env:
          DEBUG: 0
          SETTINGS_NAME: ${{ vars.SETTINGS_NAME }}
          SQL_INSTANCE_NAME: ${{ vars.SQL_INSTANCE_NAME }}
          DATABASE_NAME: ${{ vars.DATABASE_NAME }}
          GS_BUCKET_NAME: ${{ secrets.GCP_PROJECT_ID }}_${{ vars.MEDIA_BUCKET }}
          PROCESSING_QUEUE_NAME: ${{ vars.PROCESSING_QUEUE_NAME }}
          SUMMARIZATION_QUEUE_NAME: ${{ vars.SUMMARIZATION_QUEUE_NAME }}
          TICKETS_QUEUE_NAME: ${{ vars.TICKETS_QUEUE_NAME }}
          CALL_PROCESSING_BUCKET: ${{ vars.CALL_PROCESSING_BUCKET }}
          FRONTEND_PATH: ${{ secrets.FRONTEND_PATH }}
          CALL_PROCESSING_ENDPOINT: "None"
          SUMMARIZATION_ENDPOINT: "None"
          TICKETS_ENDPOINT: "None"
          SERVICE_ACCOUNT_EMAIL: "None"
        run: |
          uv run python manage.py purge_ephemeral_tokens

      - name: Collect Static
        if: env.COLLECT_STATIC == 'true'
        env:
          DEBUG: 0
          SETTINGS_NAME: ${{ vars.SETTINGS_NAME }}
          SQL_INSTANCE_NAME: ${{ vars.SQL_INSTANCE_NAME }}
          DATABASE_NAME: ${{ vars.DATABASE_NAME }}
          GS_BUCKET_NAME: ${{ secrets.GCP_PROJECT_ID }}_${{ vars.MEDIA_BUCKET }}
          PROCESSING_QUEUE_NAME: ${{ vars.PROCESSING_QUEUE_NAME }}
          SUMMARIZATION_QUEUE_NAME: ${{ vars.SUMMARIZATION_QUEUE_NAME }}
          TICKETS_QUEUE_NAME: ${{ vars.TICKETS_QUEUE_NAME }}
          CALL_PROCESSING_BUCKET: ${{ vars.CALL_PROCESSING_BUCKET }}
          FRONTEND_PATH: ${{ secrets.FRONTEND_PATH }}
          CALL_PROCESSING_ENDPOINT: "None"
          SUMMARIZATION_ENDPOINT: "None"
          TICKETS_ENDPOINT: "None"
          SERVICE_ACCOUNT_EMAIL: "None"
        run: |
          uv run python manage.py collectstatic --noinput

      - name: Create Superuser Accounts
        if: env.CREATE_SUPERUSERS == 'true'
        env:
          DEBUG: 0
          SETTINGS_NAME: ${{ vars.SETTINGS_NAME }}
          SQL_INSTANCE_NAME: ${{ vars.SQL_INSTANCE_NAME }}
          DATABASE_NAME: ${{ vars.DATABASE_NAME }}
          GS_BUCKET_NAME: ${{ secrets.GCP_PROJECT_ID }}_${{ vars.MEDIA_BUCKET }}
          PROCESSING_QUEUE_NAME: ${{ vars.PROCESSING_QUEUE_NAME }}
          SUMMARIZATION_QUEUE_NAME: ${{ vars.SUMMARIZATION_QUEUE_NAME }}
          TICKETS_QUEUE_NAME: ${{ vars.TICKETS_QUEUE_NAME }}
          CALL_PROCESSING_BUCKET: ${{ vars.CALL_PROCESSING_BUCKET }}
          FRONTEND_PATH: ${{ secrets.FRONTEND_PATH }}
          PASSWORDS_NAME: ${{ vars.PASSWORDS_NAME }}
          CALL_PROCESSING_ENDPOINT: "None"
          SUMMARIZATION_ENDPOINT: "None"
          TICKETS_ENDPOINT: "None"
          SERVICE_ACCOUNT_EMAIL: "None"
        run: |
          uv run python manage.py create_superusers

      - name: Update the Application to use Service URLs
        run: |
          PROJECT_NUMBER=$(gcloud projects describe $GOOGLE_CLOUD_PROJECT --format='value(projectNumber)')
          CONSTRUCTED_URL="https://${{ vars.SERVICE_NAME }}-${PROJECT_NUMBER}.${{ secrets.GCP_PROJECT_REGION }}.run.app"
          gcloud run services update ${{ vars.SERVICE_NAME }} \
            --region ${{ secrets.GCP_PROJECT_REGION }} \
            --update-env-vars "^##^CLOUDRUN_SERVICE_URLS=${{ steps.terraform_apply.outputs.load_balancer_url }},${{ steps.terraform_apply.outputs.cloud_run_url }},${CONSTRUCTED_URL}"

      - name: Update the Application to use the correct Call Processing Endpoint
        run: |
          gcloud run services update ${{ vars.SERVICE_NAME }} \
            --region ${{ secrets.GCP_PROJECT_REGION }} \
            --update-env-vars CALL_PROCESSING_ENDPOINT="${{ steps.terraform_apply.outputs.cloud_run_url }}${{ vars.CALL_PROCESSING_ADDRESS }}"

      - name: Update the Application to use the correct Summarization Endpoint
        run: |
          gcloud run services update ${{ vars.SERVICE_NAME }} \
            --region ${{ secrets.GCP_PROJECT_REGION }} \
            --update-env-vars SUMMARIZATION_ENDPOINT="${{ steps.terraform_apply.outputs.cloud_run_url }}${{ vars.SUMMARIZATION_ADDRESS }}"

      - name: Update the Application to use the correct Tickets Endpoint
        run: |
          gcloud run services update ${{ vars.SERVICE_NAME }} \
            --region ${{ secrets.GCP_PROJECT_REGION }} \
            --update-env-vars TICKETS_ENDPOINT="${{ steps.terraform_apply.outputs.cloud_run_url }}${{ vars.TICKETS_ADDRESS }}"

  smoke_test:
    environment:
      name: ${{ github.ref_name }}
    name: Test Deployed Application

    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: 'read'
      id-token: 'write'
      pull-requests: 'read'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.CICD_SERVICE_ACCOUNT }}

      - name: Get Firebase Service Account Key from Secret Manager
        id: secrets
        uses: google-github-actions/get-secretmanager-secrets@v3
        with:
          secrets: |-
            firebase_key:${{ secrets.GCP_PROJECT_ID }}/cicd_service_account_key

      - name: Write credentials to file
        run: |
          echo '${{ steps.secrets.outputs.firebase_key }}' > /tmp/firebase-service-account.json

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Dependencies
        run: |
          uv sync --dev

      - name: Build Audiohook emulator image
        run: |
          docker build -t genesys_audiohook_emulator:latest \
            -f ./tellme/emulators/genesys_audiohook/Dockerfile \
            ./tellme/emulators/genesys_audiohook

      - name: Build Audiohook protocol tester image
        run: |
          docker build -t genesys_audiohook_protocol_tester:latest \
            -f ./tellme/emulators/genesys_audiohook/Dockerfile.reference \
            ./tellme/emulators/genesys_audiohook

      - name: Run Remote Smoke Tests
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-service-account.json
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_PROJECT_REGION }}
          TELLME_ENV: ${{ env.TELLME_ENV }}
          SERVICE_NAME: ${{ vars.SERVICE_NAME }}
          SQL_INSTANCE_NAME: ${{ vars.SQL_INSTANCE_NAME }}
          DATABASE_NAME: ${{ vars.DATABASE_NAME }}
          GS_BUCKET_NAME: ${{ secrets.GCP_PROJECT_ID }}_${{ vars.MEDIA_BUCKET }}
          SETTINGS_NAME: ${{ vars.SETTINGS_NAME }}
          PASSWORDS_NAME: ${{ vars.PASSWORDS_NAME }}
          PROCESSING_QUEUE_NAME: ${{ vars.PROCESSING_QUEUE_NAME }}
          SUMMARIZATION_QUEUE_NAME: ${{ vars.SUMMARIZATION_QUEUE_NAME }}
          TICKETS_QUEUE_NAME: ${{ vars.TICKETS_QUEUE_NAME }}
          CALL_PROCESSING_BUCKET: ${{ vars.CALL_PROCESSING_BUCKET }}
          CALL_PROCESSING_ENDPOINT: ${{ needs.deploy.outputs.cloud_run_url }}${{ vars.CALL_PROCESSING_ADDRESS }}
          SUMMARIZATION_ENDPOINT: ${{ needs.deploy.outputs.cloud_run_url }}${{ vars.SUMMARIZATION_ADDRESS }}
          TICKETS_ENDPOINT: ${{ needs.deploy.outputs.cloud_run_url }}${{ vars.TICKETS_ADDRESS }}
          SERVICE_ACCOUNT_EMAIL: "None"
          FRONTEND_PATH: ${{ secrets.FRONTEND_PATH }}
          DEBUG: 0
          USE_CLOUD_SQL_AUTH_PROXY: 1
          CLOUD_RUN_HOST: ${{ needs.deploy.outputs.load_balancer_url }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TICKET_SERVER: ${{ secrets.TICKET_SERVER }}
          TICKET_ACCOUNT: ${{ secrets.TICKET_ACCOUNT }}
          TICKET_PROJECT: ${{ secrets.TICKET_PROJECT }}
          TICKET_KEY: ${{ secrets.TICKET_KEY }}
        run: |
          uv run pytest -v ./tellme/call_processing/tests/test_smoke_remote.py