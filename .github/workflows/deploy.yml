name: Deployment

on:
  pull_request:
    branches:
      - main
      - staging
    types: [closed]

jobs:
  deploy:
    env:
      ARTIFACT_REPO: cloud-run-source-deploy
      SERVICE_NAME: tellme-service
      SQL_INSTANCE_NAME: tellme-app
      DATABASE_NAME: db
      MEDIA_BUCKET: static_files
      SETTINGS_NAME: django_settings
      ADMIN_SETTINGS_NAME: django_admin_settings
      DEBUG: 0
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'
      pull-requests: 'read'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Environment Variables Based on Branch
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "TELLME_ENV=prod" >> $GITHUB_ENV
            echo "GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID_PROD }}" >> $GITHUB_ENV
            echo "WORKLOAD_IDENTITY_PROVIDER=${{ secrets.WORKLOAD_IDENTITY_PROVIDER_PROD }}" >> $GITHUB_ENV
            echo "CICD_SERVICE_ACCOUNT=${{ secrets.CICD_SERVICE_ACCOUNT_PROD }}" >> $GITHUB_ENV
          elif [ "${{ github.ref }}" == "refs/heads/staging" ]; then
            echo "TELLME_ENV=staging" >> $GITHUB_ENV
            echo "GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID_DEV }}" >> $GITHUB_ENV
            echo "WORKLOAD_IDENTITY_PROVIDER=${{ secrets.WORKLOAD_IDENTITY_PROVIDER_DEV }}" >> $GITHUB_ENV
            echo "CICD_SERVICE_ACCOUNT=${{ secrets.CICD_SERVICE_ACCOUNT_DEV }}" >> $GITHUB_ENV
          fi

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.CICD_SERVICE_ACCOUNT }}
          export_default_credentials: true

      - name: Detect New Migrations
        id: detect_changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            migrations:
              - 'call_miner/migrations/**'

      - name: Start Cloud SQL Proxy for Migration
        if: steps.detect_changes.outputs.migrations == 'true'
        run: |
          curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          nohup ./cloud-sql-proxy \
            --port=5432 \
            ${{ env.GCP_PROJECT_ID }}:${{ secrets.GCP_PROJECT_REGION }}:${{ env.SQL_INSTANCE_NAME }} \
            > cloud_sql_proxy.log 2>&1 &
          sleep 10

      - name: Set up Python for Migration
        if: steps.detect_changes.outputs.migrations == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Poetry for Migration
        if: steps.detect_changes.outputs.migrations == 'true'
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo 'export PATH="$HOME/.local/bin:$PATH"' >> $GITHUB_ENV

      - name: Install Dependencies for Migration
        if: steps.detect_changes.outputs.migrations == 'true'
        run: |
          poetry install --with dev --sync

      - name: Check Cloud SQL Proxy Is Running
        if: steps.detect_changes.outputs.migrations == 'true'
        run: |
          cat cloud_sql_proxy.log
          if ! pgrep -f cloud-sql-proxy; then
            echo "Cloud SQL Proxy is not running."
            exit 1
          fi

      - name: Run Migrations
        if: steps.detect_changes.outputs.migrations == 'true'
        env:
          GOOGLE_CLOUD_PROJECT: ${{ env.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_PROJECT_REGION }}
          TELLME_ENV: ${{ env.TELLME_ENV }}
          DEBUG: ${{ env.DEBUG }}
          SETTINGS_NAME: ${{ env.ADMIN_SETTINGS_NAME }}
          SQL_INSTANCE_NAME: ${{ env.SQL_INSTANCE_NAME }}
          DATABASE_NAME: ${{ env.DATABASE_NAME }}
          GS_BUCKET_NAME: ${{ env.GCP_PROJECT_ID }}_${{ env.MEDIA_BUCKET }}
          USE_CLOUD_SQL_AUTH_PROXY: 1
        run: |
          poetry run python manage.py migrate

      - name: Login to Google Artifact Registry
        uses: docker/login-action@v3
        with:
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
          registry: ${{ secrets.GCP_PROJECT_REGION }}-docker.pkg.dev

      - name: Build, tag and push container
        id: build-image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.GCP_PROJECT_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          timeout: 30m
          flags: |
            --allow-unauthenticated
            --min-instances=1 
            --execution-environment=gen2
            --service-account=${{ env.SERVICE_NAME }}-account@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com
            --add-cloudsql-instances=${{ env.GCP_PROJECT_ID }}:${{ secrets.GCP_PROJECT_REGION }}:${{ env.SQL_INSTANCE_NAME }}
          region: ${{ secrets.GCP_PROJECT_REGION }}
          image: ${{ secrets.GCP_PROJECT_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          env_vars: |
            GOOGLE_CLOUD_PROJECT=${{ env.GCP_PROJECT_ID }}
            REGION=${{ secrets.GCP_PROJECT_REGION }}
            TELLME_ENV=${{ env.TELLME_ENV }}
            DEBUG=${{ env.DEBUG }}
            SETTINGS_NAME=${{ env.SETTINGS_NAME }}
            SQL_INSTANCE_NAME=${{ env.SQL_INSTANCE_NAME }}
            DATABASE_NAME=${{ env.DATABASE_NAME }}
            GS_BUCKET_NAME=${{ env.GCP_PROJECT_ID }}_${{ env.MEDIA_BUCKET }}

      - name: Update the Application to use those Service URLs
        run: |
          gcloud run services update $SERVICE_NAME \
            --region ${{ env.REGION }} \
            --update-env-vars "^##^CLOUDRUN_SERVICE_URLS=${{ steps.deploy.outputs.url }}"
