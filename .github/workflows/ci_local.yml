name: Django CI

on:
  pull_request:
    branches:
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    environment: develop
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v3
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Dependencies
        run: |
          uv sync --dev

      - name: Wait for PostgreSQL to be ready
        run: |
          until pg_isready -h localhost -p 5432; do
            echo "Waiting for PostgreSQL..."
            sleep 1
          done

      - name: Create temporal .env file
        run: |
          echo "GOOGLE_CLOUD_PROJECT=${{ secrets.GCP_PROJECT_ID }}" >> .env
          echo "REGION=europe-west6" >> .env
          echo "DATABASE_NAME=test_db" >> .env
          echo "DATABASE_USERNAME=postgres" >> .env
          echo "DATABASE_PASSWORD=postgres" >> .env
          echo "DATABASE_HOST=localhost" >> .env
          echo "DATABASE_PORT=5432" >> .env
          echo "DEBUG=1" >> .env
          echo "SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}" >> .env
          echo "PROCESSING_PIPELINE_KEY=''" >> .env
          echo "PROCESSING_QUEUE_NAME=''" >> .env
          echo "SUMMARIZATION_QUEUE_NAME=''" >> .env
          echo "TICKETS_QUEUE_NAME=''" >> .env
          echo "CALL_PROCESSING_ENDPOINT=''" >> .env
          echo "SUMMARIZATION_ENDPOINT=''" >> .env
          echo "TICKETS_ENDPOINT=''" >> .env
          echo "SERVICE_ACCOUNT_EMAIL=''" >> .env
          echo "TASKS_EMULATOR_ADDRESS=''" >> .env
          echo "CALL_PROCESSING_BUCKET=''" >> .env
          echo "DEEPGRAM_API_KEY=fake_key" >> .env
          echo "GROQ_API_KEY=fake_key" >> .env
          echo "OPENAI_API_KEY=fake_key" >> .env
          echo "MAILER_API_KEY=fake_key" >> .env
          echo "HASH_KEY=fake_key" >> .env
          echo "SEARCH_ENGINE_ID=fake_key" >> .env
          echo "SEARCH_API_KEY=fake_key" >> .env
          echo "FIREBASE_WEB_API_KEY=fake_key" >> .env
          echo "POSTHOG_API_KEY=fake_key" >> .env
          echo "POSTHOG_HOST=fake_key" >> .env
          echo "FRONTEND_PATH='*'" >> .env

      - name: Make Migrations
        run: |
          uv run python manage.py makemigrations
        env:
          TELLME_ENV: dev

      - name: Run Migrations
        run: |
          uv run python manage.py migrate
        env:
          TELLME_ENV: dev

      - name: Run Tests
        run: |
          uv run pytest -v --ignore=./tellme/call_processing/tests/test_smoke_remote.py
        env:
          TELLME_ENV: dev

      - name: Clean up .env file
        run: |
          rm -f .env