name: Enforce Branch Rules

on:
  pull_request:
    branches:
      - main
      - staging

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR base branch to main
        if: github.event.pull_request.base.ref == 'main'
        run: |
          if [ "${{ github.event.pull_request.head.ref }}" != "staging" ]; then
            echo "PRs to the main branch must come from the staging branch."
            exit 1
          fi

      - name: Check PR base branch to staging
        if: github.event.pull_request.base.ref == 'staging'
        run: |
          if [ "${{ github.event.pull_request.head.ref }}" != "develop" ]; then
            echo "PRs to the staging branch must come from the develop branch."
            exit 1
          fi