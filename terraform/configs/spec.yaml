openapi: 3.0.3
info:
  title: TellMe Backend API
  version: 1.0.0
  description: Helping companies know their customers better through call center interactions.
paths:
  /api/v1/agents:
    get:
      operationId: agents_list
      description: |-
        A ViewSet for the Agent model. Inherits from TrendsActionsViewSet to obtain conversation trends, as well as from the
        SummaryActionsViewSet, to obtain meta-summaries of all the associated conversation summaries. This ViewSet is
        read-only since Employee-level modifications should be done with the Employee ViewSet.
        A summary of the permissions:
        - Modification is only allowed to superusers, although this is not the ViewSet for it
        - Listing is possible to Employees of the same organization. Retrieving a single Agent is only possible to the agent
            itself, to its manager, or to an organization admin of the same organization (and superusers).
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - agents
      security:
      - FirebaseAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAgentListList'
          description: ''
    options:
      operationId: cors_preflight_api_v1_agents
      summary: CORS Preflight
      description: Handle CORS preflight requests for this endpoint
      responses:
        '200':
          description: CORS preflight response
          content:
            application/json:
              schema:
                type: object
      security: []
      x-google-backend: cloud-run-backend
  /api/v1/agents/{id}:
    get:
      operationId: agents_retrieve
      description: |-
        A ViewSet for the Agent model. Inherits from TrendsActionsViewSet to obtain conversation trends, as well as from the
        SummaryActionsViewSet, to obtain meta-summaries of all the associated conversation summaries. This ViewSet is
        read-only since Employee-level modifications should be done with the Employee ViewSet.
        A summary of the permissions:
        - Modification is only allowed to superusers, although this is not the ViewSet for it
        - Listing is possible to Employees of the same organization. Retrieving a single Agent is only possible to the agent
            itself, to its manager, or to an organization admin of the same organization (and superusers).
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - agents
      security:
      - FirebaseAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDetail'
          description: ''
    options:
      operationId: cors_preflight_api_v1_agents_id
      summary: CORS Preflight
      description: Handle CORS preflight requests for this endpoint
      responses:
        '200':
          description: CORS preflight response
          content:
            application/json:
              schema:
                type: object
      security: []
      x-google-backend: cloud-run-backend
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
  /api/v1/agents/{id}/conversations:
    get:
      operationId: agents_conversations_retrieve
      description: "\n        Paginated list of conversation data. Each conversation\
        \ is represented by its title, date, and link.\n        "
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Primary key of the model instance.
        required: true
      tags:
      - agents
      security:
      - FirebaseAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        title:
                          type: string
                          description: Conversation title.
                        date:
                          type: string
                          format: date-time
                          description: Date of the conversation.
                        url:
                          type: string
                          format: uri
                          description: URL to the conversation detail.
                  next:
                    type: string
                    format: uri
                    nullable: true
                    description: URL to the next page.
                  previous:
                    type: string
                    format: uri
                    nullable: true
                    description: URL to the previous page.
                example:
                  results:
                  - title: Call with John Doe
                    date: '2023-10-01T10:00:00Z'
                    url: https://example.com/conversations/1/
                  - title: Follow-up with Jane Smith
                    date: '2023-10-02T14:30:00Z'
                    url: https://example.com/conversations/2/
                  next: https://example.com/conversations/?page=2
                  previous: null
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Detailed error message.
                example:
                  error: Invalid value provided for parameter X.
          description: Error response when the request cannot be processed.
        '403':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: Error message indicating access is forbidden.
                example:
                  detail: You do not have permission to perform this action.
          description: Error response when the user is not authorized to access the
            resource.
        '404':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: Error message indicating resource not found.
                example:
                  detail: Resource not found.
          description: Error response when the requested resource does not exist.
    options:
      operationId: cors_preflight_api_v1_agents_id_conversations
      summary: CORS Preflight
      description: Handle CORS preflight requests for this endpoint
      responses:
        '200':
          description: CORS preflight response
          content:
            application/json:
              schema:
                type: object
      security: []
      x-google-backend: cloud-run-backend
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Primary key of the model instance.
        required: true
  /api/v1/agents/{id}/managed_agents:
    get:
      operationId: agents_managed_agents_retrieve
      description: List agents under management of the current agent
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Primary key of the model instance.
        required: true
      tags:
      - agents
      security:
      - FirebaseAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Unique identifier for the agent in the managed
                            agents list.
                        name:
                          type: string
                          description: The name of the agent.
                        url:
                          type: string
                          format: uri
                          description: URL to the detailed information about the agent.
                        conversation_count:
                          type: integer
                          description: The total number of conversations handled by
                            the agent.
                        first_conversation_date:
                          type: string
                          format: date-time
                          description: The date of the first conversation handled
                            by the agent.
                        last_conversation_date:
                          type: string
                          format: date-time
                          description: The date of the last conversation handled by
                            the agent.
                      example:
                        id: 0
                        name: agent_10
                        url: http://0.0.0.0:8000/api/v1/agents/14/
                        conversation_count: 7
                        first_conversation_date: '2024-03-17T00:00:00Z'
                        last_conversation_date: '2024-12-06T00:00:00Z'
                  next:
                    type: string
                    format: uri
                    nullable: true
                    description: URL to the next page of results, if applicable.
                  previous:
                    type: string
                    format: uri
                    nullable: true
                    description: URL to the previous page of results, if applicable.
                required:
                - results
                - next
                - previous
                example:
                  results:
                  - id: 0
                    name: agent_10
                    url: http://0.0.0.0:8000/api/v1/agents/14/
                    conversation_count: 7
                    first_conversation_date: '2024-03-17T00:00:00Z'
                    last_conversation_date: '2024-12-06T00:00:00Z'
                  - id: 1
                    name: agent_04
                    url: http://0.0.0.0:8000/api/v1/agents/8/
                    conversation_count: 13
                    first_conversation_date: '2024-01-03T00:00:00Z'
                    last_conversation_date: '2024-09-03T00:00:00Z'
                  next: http://0.0.0.0:8000/api/v1/agents/4/managed_agents/?cursor=MTU=
                  previous: null
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Detailed error message.
                example:
                  error: Invalid value provided for parameter X.
          description: Error response when the request cannot be processed.
        '403':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: Error message indicating access is forbidden.
                example:
                  detail: You do not have permission to perform this action.
          description: Error response when the user is not authorized to access the
            resource.
        '404':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: Error message indicating resource not found.
                example:
                  detail: Resource not found.
          description: Error response when the requested resource does not exist.
    options:
      operationId: cors_preflight_api_v1_agents_id_managed_agents
      summary: CORS Preflight
      description: Handle CORS preflight requests for this endpoint
      responses:
        '200':
          description: CORS preflight response
          content:
            application/json:
              schema:
                type: object
      security: []
      x-google-backend: cloud-run-backend
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Primary key of the model instance.
        required: true
  /api/v1/agents/{id}/overview:
    get:
      operationId: agents_overview_retrieve
      description: "\n        Retrieve an overview of the conversation metrics for\
        \ the past two months.\n\n        This method reads the 'per_topic' parameter\
        \ from the request's query parameters to decide whether\n        to present\
        \ aggregated data across all conversations ('general'), or broken down by\
        \ each topic.\n        It then calls the object's `get_overview(per_topic)`\
        \ method, which returns a nested dictionary\n        containing metrics for\
        \ 'count', 'avg_sentiment', and 'avg_duration' over the last two months, as\n\
        \        well as the percentage change between those months.\n\n        Args:\n\
        \            obj: The object whose conversation data we want to summarize\
        \ (e.g., Organization or Agent).\n\n        Returns:\n            dict: A\
        \ nested dictionary showing last month's and prior month's values for each\
        \ metric,\n                  plus the percentage change between them. Keys\
        \ are either \"general\" or the topic names\n                  (if per_topic=True).\n\
        \        "
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Primary key of the model instance.
        required: true
      - in: query
        name: per_topic
        schema:
          type: string
          default: 'false'
        description: Whether to aggregate the trend also per topic level (e.g true
          or false)
      tags:
      - agents
      security:
      - FirebaseAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                description: |-
                  When `per_topic=False`, the top-level object has a single key 'general', and includes a 'most_popular_topic' entry. When `per_topic=True`, the top-level object has multiple keys (one for each topic name) without 'most_popular_topic'.

                  Each sub-object (topic or 'general') contains metrics: 'count', 'avg_sentiment', 'avg_duration', each of which has keys for the two relevant months plus a 'change' key.
                example:
                  general:
                    avg_sentiment:
                      '2024-01-01T00:00:00Z': 0.65
                      '2024-02-01T00:00:00Z': 0.72
                      change: 10.77
                    avg_duration:
                      '2024-01-01T00:00:00Z': 42.1
                      '2024-02-01T00:00:00Z': 46.3
                      change: 10.0
                    count:
                      '2024-01-01T00:00:00Z': 10
                      '2024-02-01T00:00:00Z': 11
                      change: 10.0
                    most_popular_topic:
                      '2024-01-01T00:00:00Z': Topic A
                      '2024-02-01T00:00:00Z': Topic B
                additionalProperties:
                  type: object
                  description: Either 'general' (when per_topic=False) or a topic
                    name (when per_topic=True).
                  properties:
                    avg_sentiment:
                      type: object
                      description: Overview of average sentiment for the last two
                        months.
                      properties:
                        change:
                          type: number
                          format: float
                          description: Percentage change between the two months, or
                            null if no prior data.
                          nullable: true
                      additionalProperties:
                        type: number
                        format: float
                        nullable: true
                    avg_duration:
                      type: object
                      description: Overview of average duration (seconds) for the
                        last two months.
                      properties:
                        change:
                          type: number
                          format: float
                          nullable: true
                      additionalProperties:
                        type: number
                        format: float
                        nullable: true
                    count:
                      type: object
                      description: Overview of conversation count for the last two
                        months.
                      properties:
                        change:
                          type: number
                          format: float
                          nullable: true
                      additionalProperties:
                        type: number
                        format: float
                        nullable: true
                    most_popular_topic:
                      type: object
                      description: Only present when per_topic=False. Maps each relevant
                        month-start to the most popular topic name (string), or null
                        if no data.
                      nullable: true
                      additionalProperties:
                        type: string
                        nullable: true
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Detailed error message.
                example:
                  error: Invalid value provided for parameter X.
          description: Error response when the request cannot be processed.
        '403':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: Error message indicating access is forbidden.
                example:
                  detail: You do not have permission to perform this action.
          description: Error response when the user is not authorized to access the
            resource.
        '404':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: Error message indicating resource not found.
                example:
                  detail: Resource not found.
          description: Error response when the requested resource does not exist.
    options:
      operationId: cors_preflight_api_v1_agents_id_overview
      summary: CORS Preflight
      description: Handle CORS preflight requests for this endpoint
      responses:
        '200':
          description: CORS preflight response
          content:
            application/json:
              schema:
                type: object
      security: []
      x-google-backend: cloud-run-backend
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Primary key of the model instance.
        required: true
  /api/v1/agents/{id}/summary_data:
    get:
      operationId: agents_summary_data_retrieve
      description: "\n        Summary of all conversation summaries (for a given period)\
        \ of the object. Includes also the date of this\n        summarization and\
        \ the number of calls that were taken into account for this summary.\n   \
        \     "
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Primary key of the model instance.
        required: true
      - in: query
        name: period
        schema:
          type: string
          default: month
        description: Summarization period (week, month, quarter)
      - in: query
        name: rolling
        schema:
          type: boolean
          default: false
        description: Whether the summarization window is rolling (week, month, quarter)
      tags:
      - agents
      security:
      - FirebaseAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary:
                    type: object
                    description: "\n                    Dictionary with a series of\
                      \ meta-summary questions and answers. Each key corresponds to\
                      \ a different\n                    meta-summary title, whereas\
                      \ each value corresponds to its meta-summary. Will be null if\
                      \ no the\n                    respective object has no associated\
                      \ conversations. \n                "
                  summary_date:
                    type: string
                    format: date-time
                    description: Date of this summarization.
                  summary_call_count:
                    type: integer
                    description: Number of calls included in the summary.
                  period_label:
                    type: string
                    description: 'Described the period for which the summary was obtained.
                      Three formats: 2025-W14 for weeks, 2025-03 for months, 2025-Q1
                      for quarters.'
                required:
                - summary
                - summary_date
                - summary_call_count
                - period_label
                example:
                  summary:
                    Reasons for Calling: Billing issues and account setup inquiries
                      are common.
                  summary_date: '2023-10-15T12:34:56Z'
                  summary_call_count: 150
                  period_label: 2023-10
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Detailed error message.
                example:
                  error: Invalid value provided for parameter X.
          description: Error response when the request cannot be processed.
        '403':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: Error message indicating access is forbidden.
                example:
                  detail: You do not have permission to perform this action.
          description: Error response when the user is not authorized to access the
            resource.
        '404':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: Error message indicating resource not found.
                example:
                  detail: Resource not found.
          description: Error response when the requested resource does not exist.
    options:
      operationId: cors_preflight_api_v1_agents_id_summary_data
      summary: CORS Preflight
      description: Handle CORS preflight requests for this endpoint
      responses:
        '200':
          description: CORS preflight response
          content:
            application/json:
              schema:
                type: object
      security: []
      x-google-backend: cloud-run-backend
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Primary key of the model instance.
        required: true
  /api/v1/agents/{id}/trend:
    get:
      operationId: agents_trend_retrieve
      description: "\n        Paginated trend regarding an object's conversations.\
        \ Expects the request to include at most three parameters:\n            period\
        \ (str): The time period granularity to use for the trend. Must be one of\
        \ \"daily\", \"weekly\", \"monthly\"\n            per_topic (bool): Indicates\
        \ whether to group by the time period AND the topic, or just by the time period\n\
        \            field (str): Specifies what field to examine. If none is specified,\
        \ the call count, average sentiment and\n                average duration\
        \ will be used.\n        "
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Primary key of the model instance.
        required: true
      - in: query
        name: per_topic
        schema:
          type: string
          default: 'false'
        description: Whether to aggregate the trend also per topic level (e.g true
          or false)
      - in: query
        name: trend_period
        schema:
          type: string
          default: monthly
        description: Trend period (e.g., daily, weekly, monthly).
      tags:
      - agents
      security:
      - FirebaseAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        count:
                          type: integer
                          description: Number of conversations.
                          nullable: true
                        date:
                          type: string
                          format: date
                          description: Date for the trend period.
                        topic_name:
                          type: string
                          description: Name of the topic.
                          nullable: true
                        topic_id:
                          type: integer
                          description: ID of the topic.
                          nullable: true
                        avg_duration:
                          type: number
                          format: float
                          description: Average duration in seconds.
                          nullable: true
                        avg_sentiment:
                          type: number
                          format: float
                          description: Average sentiment.
                          nullable: true
                  next:
                    type: string
                    format: uri
                    nullable: true
                    description: URL to the next page.
                  previous:
                    type: string
                    format: uri
                    nullable: true
                    description: URL to the previous page.
                example:
                  results:
                  - count: 5
                    date: '2023-10-01'
                  - count: 8
                    date: '2023-11-01'
                  next: https://example.com/trend/?page=2
                  previous: null
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Detailed error message.
                example:
                  error: Invalid value provided for parameter X.
          description: Error response when the request cannot be processed.
        '403':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: Error message indicating access is forbidden.
                example:
                  detail: You do not have permission to perform this action.
          description: Error response when the user is not authorized to access the
            resource.
        '404':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: Error message indicating resource not found.
                example:
                  detail: Resource not found.
          description: Error response when the requested resource does not exist.
    options:
      operationId: cors_preflight_api_v1_agents_id_trend
      summary: CORS Preflight
      description: Handle CORS preflight requests for this endpoint
      responses:
        '200':
          description: CORS preflight response
          content:
            application/json:
              schema:
                type: object
      security: []
      x-google-backend: cloud-run-backend
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Primary key of the model instance.
        required: true
  /api/v1/agents/all_summaries:
    get:
      operationId: agents_all_summaries_retrieve
      description: |-
        This method takes get_summary_data a step further, obtaining the summary data of all objects in the queryset.
        The response is now a dictionary, where the key corresponds to the object ID.
        The default summarization period is 'month'. For Customers, the summarization period is 'quarter'.
      tags:
      - agents
      security:
      - FirebaseAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    summary:
                      type: object
                      description: Detailed summary data for the object.
                      nullable: true
                    summary_date:
                      type: string
                      format: date-time
                      description: Date and time when this summary was generated.
                    summary_call_count:
                      type: integer
                      description: Number of calls included in the summary.
                    period_label:
                      type: string
                      description: Period over which recorded calls were taken
                    name:
                      type: object
                      description: Name of the conversation topic, if the summary
                        pertains to a topic
                      nullable: true
                  required:
                  - summary
                  - summary_date
                  - summary_call_count
                  - period_label
                  - name
                example:
                  '1':
                    summary:
                      Reasons for Calling: Customers frequently contact the call center
                        regarding delayed packages and order status updates.
                      Stages of the Customer Journey: These callers are predominantly
                        found in the fulfillment stage of the customer journey, particularly
                        when awaiting delivery of their orders.
                      Call Resolution Rates: Most issues are resolved during the initial
                        call, especially when agents provide updates or arrange expedited
                        shipping.
                      Churn Potential: Customers are more likely to strengthen their
                        relationship with the company, as agents are responsive and
                        proactive in addressing delivery issues.
                      Causes for Dissatisfaction: The primary cause of dissatisfaction
                        stems from delays in package delivery, which can lead to urgency
                        and frustration for customers.
                      Causes for Engagement: Customers express engagement and loyalty
                        when agents provide timely updates and solutions, such as
                        expedited shipping.
                      Suggested Actions: The company could improve customer satisfaction
                        by enhancing communication about delivery timelines and proactively
                        notifying customers of potential delays.
                    summary_date: '2025-03-28T16:23:14.593689Z'
                    summary_call_count: 6
                    name: Order Status
                  '9':
                    summary: null
                    summary_date: '2025-04-10T16:23:14.210357Z'
                    summary_call_count: 0
                    name: Product Quality
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Detailed error message.
                example:
                  error: Invalid value provided for parameter X.
          description: Error response when the request cannot be processed.
        '403':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: Error message indicating access is forbidden.
                example:
                  detail: You do not have permission to perform this action.
          description: Error response when the user is not authorized to access the
            resource.
        '404':
          content:
            application/json:
              schema:
                type: object
                properties:
