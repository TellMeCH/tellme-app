  /api/v1/organizations/overview:
    get:
      operationId: organizations_overview_retrieve
      description: "\n        Paginated trend regarding an object's conversations.\
        \ Expects the request to include at most three parameters:\n            period\
        \ (str): The time period granularity to use for the trend. Must be one of\
        \ \"daily\", \"weekly\", \"monthly\"\n            per_topic (bool): Indicates\
        \ whether to group by the time period AND the topic, or just by the time period\n\
        \            field (str): Specifies what field to examine. If none is specified,\
        \ the call count, average sentiment and\n                average duration\
        \ will be used.\n        "
      parameters:
      - in: query
        name: per_topic
        schema:
          type: string
          default: 'false'
        description: Whether to aggregate the trend also per topic level (e.g true
          or false)
      tags:
      - organizations
      security:
      - FirebaseAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                description: |-
                  A mapping of organization IDs to their conversation overview data. Each value in this mapping is the same structure as a single organization's overview:

                  - If `per_topic=False`, the key in each sub-dictionary is `'general'` plus a `'most_popular_topic'` field.
                  - If `per_topic=True`, each sub-dictionary has multiple topic-name keys and no `'most_popular_topic'`.
                additionalProperties:
                  type: object
                  description: The same shape as the single-organization OVERVIEW_RESPONSE_SCHEMA.
                    Either `'general'` or topic names as keys.
                  additionalProperties:
                    type: object
                    description: Either a metric object (e.g. `avg_sentiment`, `avg_duration`,
                      `count`) or the `'most_popular_topic'` key (which only appears
                      for `per_topic=False`).
                    properties:
                      most_popular_topic:
                        type: object
                        nullable: true
                        description: Maps each month-start datetime to the name of
                          the most popular topic for that month. Present only if `per_topic=False`.
                        additionalProperties:
                          type: string
                          nullable: true
                    additionalProperties:
                      type: object
                      description: |-
                        For metric objects (like 'avg_sentiment', 'avg_duration', or 'count'), keys are month-start datetimes in ISO8601 string form, and the 'change' key contains the percentage change. Example:
                        `{'2024-01-01T00:00:00Z': 10, '2024-02-01T00:00:00Z': 12, 'change': 20.0}`
                      properties:
                        change:
                          type: number
                          description: Percentage change from the prior month, or
                            null if not applicable.
                          nullable: true
                      additionalProperties:
                        type: number
                        nullable: true
                example:
                  '1':
                    general:
                      avg_sentiment:
                        '2024-01-01T00:00:00Z': 0.5
                        '2024-02-01T00:00:00Z': 0.6
                        change: 20.0
                      avg_duration:
                        '2024-01-01T00:00:00Z': 35.3
                        '2024-02-01T00:00:00Z': 42.0
                        change: 19.07
                      count:
                        '2024-01-01T00:00:00Z': 10
                        '2024-02-01T00:00:00Z': 12
                        change: 20.0
                      most_popular_topic:
                        '2024-01-01T00:00:00Z': Billing Issues
                        '2024-02-01T00:00:00Z': Technical Problems
                  '2':
                    Topic A:
                      avg_sentiment:
                        '2024-01-01T00:00:00Z': 0.7
                        '2024-02-01T00:00:00Z': 0.65
                        change: -7.14
                      avg_duration:
                        '2024-01-01T00:00:00Z': 38.0
                        '2024-02-01T00:00:00Z': 40.0
                        change: 5.26
                      count:
                        '2024-01-01T00:00:00Z': 8
                        '2024-02-01T00:00:00Z': 9
                        change: 12.5
                    Topic B:
                      avg_sentiment:
                        '2024-01-01T00:00:00Z': 0.5
                        '2024-02-01T00:00:00Z': 0.55
                        change: 10.0
                      avg_duration:
                        '2024-01-01T00:00:00Z': 45.1
                        '2024-02-01T00:00:00Z': 45.1
                        change: 0
                      count:
                        '2024-01-01T00:00:00Z': 10
                        '2024-02-01T00:00:00Z': 10
                        change: 0
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Detailed error message.
                example:
                  error: Invalid value provided for parameter X.
          description: Error response when the request cannot be processed.
        '403':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: Error message indicating access is forbidden.
                example:
                  detail: You do not have permission to perform this action.
