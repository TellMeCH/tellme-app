# Make sure to use "docker compose down -v" and "docker-compose up --build"
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "${DATABASE_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  firebase:
    build:
      context: ./tell_me/emulators/firebase
    ports:
      - "9099:9099"
    networks:
      - app-network

  tasks:
    image: ghcr.io/aertje/cloud-tasks-emulator:latest
    command:
      - --host=tasks
      - "-queue=projects/${GOOGLE_CLOUD_PROJECT}/locations/${REGION}/queues/${CLOUD_TASKS_QUEUE_NAME}"
    ports:
      - "8123:8123"
    networks:
      - app-network

  storage:
    image: oittaa/gcp-storage-emulator:latest
    command:
      - start
      - --host=storage
      - --default-bucket=${GOOGLE_CLOUD_PROJECT}_${CALL_PROCESSING_BUCKET}
    ports:
      - "9023:9023"
    environment:
      PORT: 9023
    networks:
      - app-network

  django:
    build: .
    command: >
      bash -c "
        until curl -s http://firebase:9099/; do
          echo 'Waiting for Firebase Emulator...';
          sleep 1;
        done;
        until nc -z tasks 8123; do
          echo 'Waiting for Cloud Tasks Emulator...'
          sleep 1
        done;
        until nc -z storage 9023; do
          echo 'Waiting for Cloud Storage Emulator...'
          sleep 1
        done;
        curl -H 'Authorization: Bearer owner' -X DELETE http://firebase:9099/emulator/v1/projects/${GOOGLE_CLOUD_PROJECT}/accounts;
        if [ \"${RUN_DB_SETUP}\" = \"true\" ]; then
          echo 'Running migrations...'
          python manage.py collectstatic --noinput
          python manage.py makemigrations
          python manage.py migrate
          python manage.py create_sample_data
        fi
        python manage.py runserver 0.0.0.0:8080
      "
    volumes:
      - .:/app
      - ${GOOGLE_APPLICATION_CREDENTIALS}:/tmp/gcp-credentials.json:ro
    ports:
      - "8080:8080"
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-credentials.json
    depends_on:
      - db
      - firebase
      - tasks
      - storage
    env_file:
      - .env
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network: