# Make sure to use "docker compose down -v" and "docker-compose up --build"
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "${DATABASE_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  firebase:
    build:
      context: ./firebase-emulator
    ports:
      - "9099:9099"
    networks:
      - app-network

  cloud_tasks_emulator:
    image: ghcr.io/aertje/cloud-tasks-emulator:latest
    command:
      - --host=cloud_tasks_emulator
      - "-queue=projects/${GOOGLE_CLOUD_PROJECT}/locations/${REGION}/queues/${CLOUD_TASKS_QUEUE_NAME}"
    ports:
      - "8123:8123"
    networks:
      - app-network

  django:
    build: .
    command: >
      bash -c "
        until curl -s http://firebase:9099/; do
          echo 'Waiting for Firebase Emulator...';
          sleep 1;
        done;
        until nc -z cloud_tasks_emulator 8123; do
          echo 'Waiting for Cloud Tasks Emulator...'
          sleep 1
        done;
        curl -H 'Authorization: Bearer owner' -X DELETE http://firebase:9099/emulator/v1/projects/${GOOGLE_CLOUD_PROJECT}/accounts;
        python manage.py makemigrations &&
        python manage.py migrate &&
        python manage.py create_sample_data &&
        python manage.py runserver 0.0.0.0:8080
      "
    volumes:
      - .:/app
    ports:
      - "8080:8080"
    depends_on:
      - db
      - firebase
      - cloud_tasks_emulator
    env_file:
      - .env
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network: